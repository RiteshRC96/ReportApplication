<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="icon" type="image/png" th:href="@{/favicon.png}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
/* ---------- GLOBAL ---------- */
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://t4.ftcdn.net/jpg/17/42/93/47/240_F_1742934729_zZy9JHoPHwI1G7xBOGUdAE47A9N6zarS.jpg");
  background-size: cover;
  background-position: center;
  padding: 20px;
}

/* ---------- WRAPPER ---------- */
.login-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

/* ---------- LOGIN CARD ---------- */
.login-card {
  width: 100%;
  max-width: 420px;
  padding: 36px 34px;
  border-radius: 14px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card h3 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 26px;
  color: #1f2933;
}

/* ---------- INPUTS ---------- */
.form-control {
  border-radius: 8px;
  padding: 12px;
  font-size: 15px;
  border: 1px solid #ced4da;
  background: #ffffff;
}

.form-control:focus {
  border-color: #39d98a;
  box-shadow: 0 0 0 0.15rem rgba(57,217,138,0.25);
}

/* ---------- PASSWORD TOGGLE ---------- */
.password-toggle {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 16px;
  opacity: 0.7;
}

/* ---------- BUTTON ---------- */
.btn-main {
  background: #39d98a;
  border: none;
  color: #000;
  font-weight: 600;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
}

.btn-main:hover {
  background: #2ecf7f;
}

/* ---------- LINKS ---------- */
.login-links {
  font-size: 13px;
  margin-top: 18px;
  text-align: center;
  color: #555;
}

.login-links a {
  color: #39d98a;
  text-decoration: none;
  font-weight: 600;
}

/* ---------- TOAST ---------- */
.toast-message {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 9999;
}

.toast-error { background: #dc3545; color: #fff; }

</style>
</head>

<body>

<div th:if="${error}" class="toast-message toast-error" th:text="${error}"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <img th:src="@{/logo.png}" alt="Logo" style="height: 60px; width: 60px; object-fit: contain">
      <h3 class="mt-2">Forgot Password</h3>
    </div>

    <form th:action="@{/forgot-password}" method="post" onsubmit="return validatePasswords(event)">
      <input class="form-control mb-3" type="email" name="email" placeholder="Email address" required>

      <div class="position-relative mb-3">
        <input class="form-control" type="password" name="password" id="password" placeholder="New Password" required minlength="4">
        <span class="password-toggle" onclick="togglePassword('password', this)">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <div class="position-relative mb-3">
        <input class="form-control" type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password" required minlength="4">
        <span class="password-toggle" onclick="togglePassword('confirmPassword', this)">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <button type="submit" class="btn btn-main w-100">Send OTP</button>
    </form>

    <div class="login-links">
      Back to <a href="/">Login</a>
    </div>
  </div>
</div>

<script>
function togglePassword(id, el) {
  const p = document.getElementById(id);
  const icon = el.querySelector('i');
  if (p.type === "password") {
    p.type = "text";
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    p.type = "password";
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}

function validatePasswords(event) {
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;
  if (pass !== confirm) {
    alert("Passwords do not match!");
    event.preventDefault();
    return false;
  }
  return true;
}

setTimeout(() => {
  const toast = document.querySelector(".toast-message");
  if (toast) {
    toast.style.opacity = "0";
    setTimeout(() => toast.remove(), 500);
  }
}, 3000);
</script>

</body>
</html>
