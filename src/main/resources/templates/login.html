<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="icon" type="image/png" th:href="@{/favicon.png}">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
/* ---------- GLOBAL ---------- */
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://t4.ftcdn.net/jpg/17/42/93/47/240_F_1742934729_zZy9JHoPHwI1G7xBOGUdAE47A9N6zarS.jpg");
  background-size: cover;
  background-position: center;
  padding: 20px;
}

/* ---------- WRAPPER ---------- */
.login-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

/* ---------- LOGIN CARD ---------- */
.login-card {
  width: 100%;
  max-width: 420px;
  padding: 36px 34px;
  border-radius: 14px;

  /* ✅ PROFESSIONAL GLASS CARD */
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);

  box-shadow:
    0 18px 40px rgba(0,0,0,0.35);

  animation: fadeUp 0.5s ease;
}

/* ---------- ANIMATION ---------- */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---------- TITLE ---------- */
.login-card h3 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 26px;
  color: #1f2933;
}

/* ---------- INPUTS ---------- */
.form-control {
  border-radius: 8px;
  padding: 12px;
  font-size: 15px;
  border: 1px solid #ced4da;
  background: #ffffff;
  color: #1f2933;
}

.form-control::placeholder {
  color: #6c757d;
}

.form-control:focus {
  border-color: #39d98a;
  box-shadow: 0 0 0 0.15rem rgba(57,217,138,0.25);
}

/* ---------- BUTTON ---------- */
.btn-login {
  background: #39d98a;
  border: none;
  color: #000;
  font-weight: 600;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  margin-top: 14px;
}

.btn-login:hover {
  background: #2ecf7f;
}

/* ---------- PASSWORD TOGGLE ---------- */
.password-toggle {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 16px;
  opacity: 0.7;
}

.password-toggle:hover {
  opacity: 1;
}

/* ---------- LINKS ---------- */
.login-links {
  font-size: 13px;
  margin-top: 18px;
  text-align: center;
  color: #555;
}

.login-links a {
  color: #39d98a;
  text-decoration: none;
  font-weight: 600;
}

.login-links a:hover {
  text-decoration: underline;
}

/* ---------- TOAST ---------- */
.toast-message {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 9999;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.toast-success {
  background: #39d98a;
  color: #000;
}

.toast-error {
  background: #dc3545;
  color: #fff;
}
</style>
</head>

<body>

<!-- SUCCESS -->
<div class="toast-message toast-success"
     th:if="${param.logout}">
  Logged out successfully
</div>

<!-- ERROR -->
<div class="toast-message toast-error"
     th:if="${param.error}">
  Invalid email or password
</div>

<div class="toast-message toast-success"
     th:if="${message}">
  <span th:text="${message}"></span>
</div>

<div class="toast-message toast-error"
     th:if="${error}">
  <span th:text="${error}"></span>
</div>

<!-- LOGIN SECTION -->
<div class="login-wrapper">

  <div class="login-card">
    <div class="text-center mb-4">
      <img th:src="@{/logo.png}" alt="Logo" style="height: 60px; width: 60px; object-fit: contain">

      <h3 class="mt-2">Login</h3>
    </div>

    <form th:action="@{/login}" method="post">

      <input class="form-control mb-3"
             type="email"
             name="email"
             placeholder="Email address"
             required>

      <div class="position-relative mb-3">
        <input class="form-control"
               type="password"
               name="password"
               id="password"
               placeholder="Password"
               required>
        <span class="password-toggle" onclick="togglePassword(this)">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <button type="submit" class="btn btn-login w-100">
        Login
      </button>

      <div class="text-center mt-3 mb-2" style="font-size: 14px; color: #6c757d;">OR</div>
      <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-dark w-100 mb-3" style="border-radius: 8px; font-weight: 600;">
        <i class="fab fa-google me-2" style="color: #DB4437;"></i> Login with Google
      </a>
    </form>

	<div class="login-links mt-1">
      <a th:href="@{/forgot-password}">Forgot Password?</a>
    </div>
    
    <div class="login-links">
      Don't have an account?
      <a th:href="@{/register}">Register</a>
    </div>
    
  </div>


<script>
function togglePassword(el) {
  const p = document.getElementById("password");
  const icon = el.querySelector('i');
  if (p.type === "password") {
    p.type = "text";
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    p.type = "password";
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}

setTimeout(() => {
  const toast = document.querySelector(".toast-message");
  if (toast) {
    toast.style.opacity = "0";
    setTimeout(() => toast.remove(), 500);
  }
}, 3000);

/* SUCCESS POPUP */
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('regSuccess')) {
        alert("Account Created Successfully!");
        window.location.href = "/"; // Clear parameter
    }
};
</script>

</body>
</html>
