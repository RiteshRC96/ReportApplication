<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP</title>
<link rel="icon" type="image/png" th:href="@{/favicon.png}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ---------- GLOBAL ---------- */
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://t4.ftcdn.net/jpg/17/42/93/47/240_F_1742934729_zZy9JHoPHwI1G7xBOGUdAE47A9N6zarS.jpg");
  background-size: cover;
  background-position: center;
  padding: 20px;
}

/* ---------- WRAPPER ---------- */
.login-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

/* ---------- CARD ---------- */
.login-card {
  width: 100%;
  max-width: 420px;
  padding: 36px 34px;
  border-radius: 14px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card h3 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 10px;
  color: #1f2933;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #555;
  margin-bottom: 25px;
}

/* ---------- OTP BOXES ---------- */
.otp-boxes {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 8px;
}

.otp-boxes input {
  width: 100%;
  height: 50px;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  border-radius: 8px;
  border: 1px solid #ced4da;
  background: #fff;
  transition: all 0.2s ease;
}

.otp-boxes input:focus {
  border-color: #39d98a;
  box-shadow: 0 0 0 0.15rem rgba(57,217,138,0.25);
  outline: none;
}

/* ---------- BUTTON ---------- */
.btn-main {
  background: #39d98a;
  border: none;
  color: #000;
  font-weight: 600;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
}

.btn-main:hover {
  background: #2ecf7f;
}

/* ---------- LINKS ---------- */
.login-links {
  font-size: 13px;
  margin-top: 18px;
  text-align: center;
  color: #555;
}

.login-links a {
  color: #39d98a;
  text-decoration: none;
  font-weight: 600;
}

/* ---------- TOAST ---------- */
.toast-message {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 9999;
}
.toast-success { background: #39d98a; color: #000; }
.toast-error { background: #dc3545; color: #fff; }

</style>
</head>

<body>

<div th:if="${message}" class="toast-message toast-success" th:text="${message}"></div>
<div th:if="${error}" class="toast-message toast-error" th:text="${error}"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <img th:src="@{/logo.png}" alt="Logo" style="height: 60px; width: 60px; object-fit: contain">
      <h3 class="mt-2">Verify OTP</h3>
      <p class="subtitle">Enter the 6-digit code sent to your email.</p>
    </div>

    <form th:action="@{/verify-otp}" method="post" onsubmit="combineOtp()">
      <div class="otp-boxes">
        <input maxlength="1" class="otp-input" inputmode="numeric" oninput="moveNext(this,0)" onkeypress="return isNumber(event)" required>
        <input maxlength="1" class="otp-input" inputmode="numeric" oninput="moveNext(this,1)" onkeypress="return isNumber(event)" required>
        <input maxlength="1" class="otp-input" inputmode="numeric" oninput="moveNext(this,2)" onkeypress="return isNumber(event)" required>
        <input maxlength="1" class="otp-input" inputmode="numeric" oninput="moveNext(this,3)" onkeypress="return isNumber(event)" required>
        <input maxlength="1" class="otp-input" inputmode="numeric" oninput="moveNext(this,4)" onkeypress="return isNumber(event)" required>
        <input maxlength="1" class="otp-input" inputmode="numeric" oninput="moveNext(this,5)" onkeypress="return isNumber(event)" required>
      </div>

      <input type="hidden" name="otp" id="full-otp">

      <button type="submit" class="btn btn-main w-100">Verify & Update Password</button>
    </form>

    <div class="login-links">
      Didn't get code? <a href="/forgot-password">Resend</a>
    </div>
  </div>
</div>

<script>
function moveNext(el, index) {
  if (el.value.length === 1) {
    const inputs = document.querySelectorAll(".otp-input");
    if (inputs[index + 1]) inputs[index + 1].focus();
  }
}

function combineOtp() {
  let otp = "";
  document.querySelectorAll(".otp-input").forEach(v => otp += v.value);
  document.getElementById("full-otp").value = otp;
}

function isNumber(evt) {
    evt = (evt) ? evt : window.event;
    var charCode = (evt.which) ? evt.which : evt.keyCode;
    if (charCode > 31 && (charCode < 48 || charCode > 57)) {
        return false;
    }
    return true;
}

setTimeout(() => {
  const toast = document.querySelector(".toast-message");
  if (toast) {
    toast.style.opacity = "0";
    setTimeout(() => toast.remove(), 500);
  }
}, 3000);
</script>

</body>
</html>
