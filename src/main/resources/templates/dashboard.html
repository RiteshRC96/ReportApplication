<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 20px 15px;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(135deg, #1f2a30, #243840);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-link {
            font-weight: 600;
            color: #fff !important;
            position: relative;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #39d98a;
            transition: 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .btn-logout {
            border-radius: 20px;
            font-weight: 600;
        }

        /* DASHBOARD BOX */
        .dashboard-box {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 40px 20px;
            border-radius: 30px;
            background: linear-gradient(135deg, #cfe9ef, #d9f0f5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 4px solid #ff7a2f;
            text-align: center;
        }

        /* TYPEWRITER */
        .typewriter {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #333;
            width: fit-content;
            margin: 0 auto 40px auto;
            animation: blinkCursor 0.8s infinite;
        }

        @media (max-width: 576px) {
            .typewriter {
                font-size: 20px;
            }

            .dashboard-box {
                padding: 30px 15px;
                margin: 20px auto;
            }
        }

        @keyframes blinkCursor {
            0% {
                border-color: transparent;
            }

            50% {
                border-color: #333;
            }

            100% {
                border-color: transparent;
            }
        }

        /* WALLET */
        .wallet-card {
            width: 100%;
            max-width: 320px;
            margin: auto;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .wallet-left {
            background: linear-gradient(135deg, #1f2a30, #2c3e50);
            color: white;
            padding: 15px;
            flex: 1;
            text-align: left;
        }

        .wallet-right {
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .btn-add-money {
            background: #fff;
            color: #1f2a30;
            font-weight: 600;
            border-radius: 10px;
            padding: 8px 18px;
            border: none;
            transition: 0.3s;
        }

        .btn-add-money:hover {
            background: #39d98a;
            color: black;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #777;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark navbar-expand-lg px-3">
        <div class="container-fluid">

            <span class="navbar-brand d-flex align-items-center">
                <img th:src="@{/logo.png}" alt="Logo"
                    style="height: 35px; width: 35px; object-fit: contain; margin-right: 8px;">
                ShreeGuru Software Solutions
            </span>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Master</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/weaver-trader">Weaver / Trader</a></li>
                            <li><a class="dropdown-item" href="/quality">Quality</a></li>
                        </ul>
                    </li>

                    <li class="nav-item"><a class="nav-link" href="/gen-bill">Job Contract</a></li>
                    <li class="nav-item"><a class="nav-link" href="/report">Report</a></li>
                </ul>

                <form action="/logout" method="post" class="ms-3">
                    <button class="btn btn-danger btn-logout">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <main>

        <!-- DASHBOARD BOX -->
        <div class="dashboard-box">

            <!-- TYPEWRITER -->
            <div id="typewriter" class="typewriter"></div>

            <!-- WALLET -->
            <div class="wallet-card">
                <div class="wallet-left">
                    <small style="opacity:0.7;">WALLET BALANCE</small>
                    <h2>₹ <span th:text="${#numbers.formatDecimal(walletBalance,1,2)}">0.00</span></h2>
                </div>

                <div class="wallet-right">
                    <a href="/payment" class="btn btn-add-money">
                        <i class="bi bi-plus-lg"></i> Add Money
                    </a>
                </div>
            </div>

        </div>

    </main>

    <!-- TYPEWRITER SCRIPT -->
    <script th:inline="javascript">
        const username = "[[${username}]]";
        const text = "Welcome " + username + " 👋";

        let i = 0;
        const el = document.getElementById("typewriter");

        function type() {
            if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, 80);
            }
        }

        type();
    </script>

    <footer>
        © All Rights Reserved ShreeGuru Software Solution.V:1.1
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
