<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">


    <link th:replace="~{fragments :: header-assets}">

    <style>
        body {
            background: #eef2f5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 20px 15px;
        }

        /* DASHBOARD BOX */
        .dashboard-box {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 40px 20px;
            border-radius: 30px;
            background: linear-gradient(135deg, #cfe9ef, #d9f0f5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 4px solid #ff7a2f;
            text-align: center;
        }

        /* TYPEWRITER */
        .typewriter {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #333;
            width: fit-content;
            margin: 0 auto 40px auto;
            animation: blinkCursor 0.8s infinite;
        }

        @media (max-width: 576px) {
            .typewriter {
                font-size: 20px;
            }

            .dashboard-box {
                padding: 30px 15px;
                margin: 20px auto;
            }
        }

        @keyframes blinkCursor {
            0% {
                border-color: transparent;
            }

            50% {
                border-color: #333;
            }

            100% {
                border-color: transparent;
            }
        }

        /* WALLET */
        .wallet-card {
            width: 100%;
            max-width: 320px;
            margin: auto;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .wallet-left {
            background: linear-gradient(135deg, #1f2a30, #2c3e50);
            color: white;
            padding: 15px;
            flex: 1;
            text-align: left;
        }

        .wallet-right {
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .btn-add-money {
            background: #fff;
            color: #1f2a30;
            font-weight: 600;
            border-radius: 10px;
            padding: 8px 18px;
            border: none;
            transition: 0.3s;
        }

        .btn-add-money:hover {
            background: #39d98a;
            color: black;
        }
    </style>
</head>

<body>

    <nav th:replace="~{fragments :: navbar}"></nav>

    <main>

        <!-- DASHBOARD BOX -->
        <div class="dashboard-box">

            <!-- TYPEWRITER -->
            <div id="typewriter" class="typewriter"></div>

            <!-- WALLET -->
            <div class="wallet-card">
                <div class="wallet-left">
                    <small style="opacity:0.7;">WALLET BALANCE</small>
                    <h2>₹ <span th:text="${#numbers.formatDecimal(walletBalance,1,2)}">0.00</span></h2>
                </div>

                <div class="wallet-right">
                    <a href="/payment" class="btn btn-add-money">
                        <i class="bi bi-plus-lg"></i> Add Money
                    </a>
                </div>
            </div>

        </div>

    </main>

    <!-- TYPEWRITER SCRIPT -->
    <script th:inline="javascript">
        const username = "[[${username}]]";
        const text = "Welcome " + username + " 👋";

        let i = 0;
        const el = document.getElementById("typewriter");

        function type() {
            if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, 80);
            }
        }

        type();
    </script>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>

</html>
