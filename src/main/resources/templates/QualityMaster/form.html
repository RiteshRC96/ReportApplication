<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Master</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">


    <link th:replace="~{fragments :: header-assets}">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }

        main {
            flex: 1;
        }

        /* Additional styles for Quality Form */
        .form-card {
            max-width: 900px;
            margin: 30px auto;
            padding: 35px 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h3 {
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
            color: #1f2933;
        }

        /* ---------- FORM CARD ---------- */
        .form-card {
            max-width: 900px;
            margin: 30px auto;
            padding: 35px 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h3 {
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
            color: #1f2933;
        }

        .form-label {
            font-weight: 600;
            color: #243840;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            border: 1px solid #ced4da;
            color: #1f2933;
            padding: 10px;
            font-size: 15px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #39d98a;
            box-shadow: 0 0 0 0.15rem rgba(57,217,138,0.25);
        }

        .readonly-field {
            background: #fff3cd;
        }

        hr {
            border-color: #ddd;
        }

        .btn-success {
            background: #39d98a;
            color: #000;
            font-weight: 600;
            border-radius: 20px;
            padding: 8px 22px;
            border: none;
            transition: 0.3s ease;
        }

        .btn-success:hover {
            background: #2ecf7f;
            transform: translateY(-2px);
            color: #000;
        }

        .btn-secondary {
            border-radius: 20px;
            padding: 8px 22px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
        }

        /* ---------- RESPONSIVE DESIGN ---------- */
        /* MOBILE (< 576px) */
        @media (max-width: 575px) {
            .form-card {
                max-width: 100%;
                margin: 15px;
                padding: 20px 18px;
            }

            .form-card h3 {
                font-size: 16px;
                margin-bottom: 18px;
            }

            .form-label {
                font-size: 12px;
                margin-bottom: 4px;
            }

            .form-control,
            .form-select {
                font-size: 13px;
                padding: 8px;
            }

            .btn-success,
            .btn-secondary {
                font-size: 12px;
                padding: 6px 16px;
                width: 100%;
                margin-top: 8px;
            }

            .row.g-3 {
                gap: 10px !important;
            }

            .col-md-2 {
                flex: 0 0 100%;
            }
        }

        /* TABLET (576px - 1023px) */
        @media (min-width: 576px) and (max-width: 1023px) {
            .form-card {
                max-width: 100%;
                margin: 25px 15px;
                padding: 28px 25px;
            }

            .form-card h3 {
                font-size: 18px;
                margin-bottom: 22px;
            }

            .form-label {
                font-size: 13px;
                margin-bottom: 5px;
            }

            .form-control,
            .form-select {
                font-size: 14px;
                padding: 9px;
            }

            .btn-success,
            .btn-secondary {
                font-size: 13px;
                padding: 8px 20px;
            }

            .col-md-2 {
                flex: 0 0 50%;
            }
        }

        /* DESKTOP (> 1024px) */
        @media (min-width: 1024px) {
            .form-card {
                max-width: 900px;
                margin: 30px auto;
                padding: 35px 40px;
            }

            .form-card h3 {
                font-size: 22px;
                margin-bottom: 28px;
            }

            .form-label {
                font-size: 14px;
            }

            .form-control,
            .form-select {
                font-size: 15px;
                padding: 10px;
            }

            .btn-success,
            .btn-secondary {
                font-size: 14px;
                padding: 8px 22px;
            }

            .col-md-2 {
                flex: 0 0 16.667%;
            }
        }
    </style>
</head>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main>
<!-- FORM -->
<div class="form-card">

    <h3 th:text="${quality.id == null ? 'Add Quality Master' : 'Edit Quality Master'}"></h3>

    <form th:action="@{/quality/save}" method="post" th:object="${quality}">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label class="form-label">Width</label>
                <input type="text" class="form-control" th:field="*{width}" id="width" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Reed</label> 
                <input type="text" class="form-control" th:field="*{reed}" id="reed" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Pick</label>
                <input type="text" class="form-control" th:field="*{pick}" id="pick" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Warp</label>
                <input type="text" class="form-control" th:field="*{warp}" id="warp" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Weft</label>
                <input type="text" class="form-control" th:field="*{weft}" id="weft" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Reed Space</label>
                <input type="text" class="form-control" th:field="*{reedSpace}" id="reedSpace" required>
            </div>

            <div class="col-md-2 mt-3">
                <label class="form-label">Weave</label>
                <input type="text" class="form-control" th:field="*{weave}" id="weave" required>
            </div>
        </div>

        <hr class="my-4">

        <div class="mb-3">
            <label class="form-label">Quality Name</label>
            <input type="text" class="form-control readonly-field" th:field="*{qualityName}" id="qualityName" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Alias</label>
            <input type="text" class="form-control readonly-field" id="alias" th:field="*{alias}" readonly>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-success">Save</button>
            <a href="/quality" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </form>

</div>

</main>

<script>
    const inputs = ["warp","weft","reed","pick","width","weave"];

    inputs.forEach(id => {
        document.getElementById(id).addEventListener("input", generateQuality);
    });

    function generateQuality() {
        let warp = document.getElementById("warp").value || "";
        let weft = document.getElementById("weft").value || "";
        let reed = document.getElementById("reed").value || "";
        let pick = document.getElementById("pick").value || "";
        let width = document.getElementById("width").value || "";
        let weave = document.getElementById("weave").value || "";

        if(warp && weft && reed && pick && width){
            let quality = `${width}" ${reed}*${pick} / ${warp}*${weft} -${weave}`;
            
            <!-- width"reed*pick/warp*weft-->
            document.getElementById("qualityName").value = quality;
            document.getElementById("alias").value = quality;
        }
    }
</script>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
