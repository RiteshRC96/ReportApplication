<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaver / Trader Master</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">


    <link th:replace="~{fragments :: header-assets}">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }

        main {
            flex: 1;
        }

        /* Additional styles for Weaver/Trader Form */
        .form-card {
            max-width: 550px;
            margin: 30px auto;
            padding: 35px 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h2 {
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
            color: #1f2933;
        }

        /* ---------- FORM CARD ---------- */
        .form-card {
            max-width: 550px;
            margin: 30px auto;
            padding: 35px 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h2 {
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
            color: #1f2933;
        }

        .form-label {
            font-weight: 600;
            color: #243840;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            border: 1px solid #ced4da;
            color: #1f2933;
            padding: 10px;
            font-size: 15px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #39d98a;
            box-shadow: 0 0 0 0.15rem rgba(57, 217, 138, 0.25);
        }

        .mb-3 {
            margin-bottom: 1.2rem !important;
        }

        .btn-save {
            background: #39d98a;
            color: #000;
            font-weight: 600;
            border-radius: 20px;
            padding: 8px 22px;
            border: none;
            transition: 0.3s ease;
        }

        .btn-save:hover {
            background: #2ecf7f;
            transform: translateY(-2px);
        }

        .btn-cancel {
            border-radius: 20px;
            padding: 8px 22px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-cancel:hover {
            transform: translateY(-2px);
        }

        /* Mobile Contact Book Styles */
        .contact-book-btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .contact-book-btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .input-group-btn {
            display: flex;
            gap: 5px;
        }

        .phone-input {
            flex: 1;
        }

        /* ---------- RESPONSIVE DESIGN ---------- */
        /* MOBILE (< 576px) */
        @media (max-width: 575px) {
            .form-card {
                max-width: 100%;
                margin: 15px;
                padding: 20px 18px;
            }

            .form-card h2 {
                font-size: 16px;
                margin-bottom: 18px;
            }

            .form-label {
                font-size: 12px;
                margin-bottom: 4px;
            }

            .form-control,
            .form-select {
                font-size: 13px;
                padding: 8px;
            }

            .mb-3 {
                margin-bottom: 0.8rem !important;
            }

            .mb-4 {
                margin-bottom: 0.8rem !important;
            }

            .input-group-btn {
                flex-direction: column;
            }

            .contact-book-btn {
                width: 100%;
                font-size: 12px;
                padding: 8px 10px;
            }

            .btn-save,
            .btn-cancel {
                font-size: 12px;
                padding: 6px 16px;
                width: 100%;
            }

            .d-flex.justify-content-center {
                flex-direction: column;
                gap: 8px !important;
            }
        }

        /* TABLET (576px - 1023px) */
        @media (min-width: 576px) and (max-width: 1023px) {
            .form-card {
                max-width: 100%;
                margin: 25px 15px;
                padding: 28px 25px;
            }

            .form-card h2 {
                font-size: 18px;
                margin-bottom: 22px;
            }

            .form-label {
                font-size: 13px;
                margin-bottom: 5px;
            }

            .form-control,
            .form-select {
                font-size: 14px;
                padding: 9px;
            }

            .contact-book-btn {
                font-size: 13px;
                padding: 8px 12px;
            }

            .btn-save,
            .btn-cancel {
                font-size: 13px;
                padding: 8px 20px;
            }

            .input-group-btn {
                gap: 5px;
            }
        }

        /* DESKTOP (> 1024px) */
        @media (min-width: 1024px) {
            .form-card {
                max-width: 550px;
                margin: 30px auto;
                padding: 35px 40px;
            }

            .form-card h2 {
                font-size: 22px;
                margin-bottom: 28px;
            }

            .form-label {
                font-size: 14px;
            }

            .form-control,
            .form-select {
                font-size: 15px;
                padding: 10px;
            }

            .contact-book-btn {
                font-size: 14px;
                padding: 8px 12px;
            }

            .btn-save,
            .btn-cancel {
                font-size: 14px;
                padding: 8px 22px;
            }
        }
    </style>
</head>

<body>

    <nav th:replace="~{fragments :: navbar}"></nav>

    <main>
        <!-- FORM -->
        <div class="form-card">

            <h2 th:text="${wt.id == null ? 'Add Weaver / Trader' : 'Edit Weaver / Trader'}"></h2>

            <!-- FLASH MESSAGES -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/weaver-trader/save}" method="post" th:object="${wt}" id="weaverTraderForm">
                <input type="hidden" th:field="*{id}" />

                <!-- Type Selection (Moved to Top) -->
                <div class="mb-4">
                    <label class="form-label">Type</label>
                    <select class="form-select" th:field="*{type}" required>
                        <option value="">Select</option>
                        <option value="WEAVER">WEAVER</option>
                        <option value="TRADER">TRADER</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" th:field="*{name}" required>
                </div>

                <div class="mb-3">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="form-label" style="margin: 0;">Owner Mob No 1</label>
                        <button type="button" class="contact-book-btn" id="contactBookBtn"
                            onclick="selectFromContacts('phno')">📇 Contacts</button>
                    </div>
                    <input type="text" class="form-control phone-input" th:field="*{phno}" required pattern="[0-9]{10}"
                        maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        placeholder="10 digit mobile number">
                </div>

                <div class="mb-3">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="form-label" style="margin: 0;">Owner Mob No 2</label>
                        <button type="button" class="contact-book-btn" id="ownerContactBtn"
                            onclick="selectFromContacts('ownerMobNo')">📇 Contacts</button>
                    </div>
                    <input type="text" class="form-control phone-input" th:field="*{ownerMobNo}" pattern="[0-9]{10}"
                        maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        placeholder="10 digit mobile number">
                </div>

                <div class="mb-3">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="form-label" style="margin: 0;">Divanji Mob No</label>
                        <button type="button" class="contact-book-btn" id="divanjContactBtn"
                            onclick="selectFromContacts('divanjMobNo')">📇 Contacts</button>
                    </div>
                    <input type="text" class="form-control phone-input" th:field="*{divanjMobNo}" pattern="[0-9]{10}"
                        maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        placeholder="10 digit mobile number">
                </div>

                <div class="mb-3 brokerage-fields">
                    <label class="form-label">Weaver Brokerage %</label>
                    <input type="number" class="form-control" th:field="*{weaverBrokeragePercent}" step="0.01"
                        placeholder="e.g., 2.5">
                </div>

                <div class="mb-4 brokerage-fields">
                    <label class="form-label">Weaver Brokerage Paisa (₹)</label>
                    <input type="number" class="form-control" th:field="*{weaverBrokeragePaisa}" step="0.01"
                        placeholder="e.g., 100.50">
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-save">Save</button>
                    <a href="/weaver-trader" class="btn btn-secondary btn-cancel">Cancel</a>
                </div>
            </form>

        </div>

        <!-- JavaScript for Mobile Contact Book Functionality -->
        <script>
            // Helper function to detect if device is mobile
            function isMobileDevice() {
                const ua = navigator.userAgent || navigator.vendor || window.opera;
                return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua.toLowerCase());
            }

            // Helper function to check if Contact Picker API is supported
            function isContactPickerSupported() {
                return 'contacts' in navigator && 'ContactsManager' in window;
            }

            // Helper function to check if Cordova Contacts API is available
            function isCordonvaContactsSupported() {
                return typeof navigator.contacts !== 'undefined' && navigator.contacts;
            }

            async function selectFromContacts(fieldId) {
                // Try Contact Picker API first (modern standard)
                if (isContactPickerSupported()) {
                    try {
                        const props = ['tel'];
                        const contacts = await navigator.contacts.select(props, { multiple: false });
                        if (contacts && contacts.length > 0 && contacts[0].tel && contacts[0].tel.length > 0) {
                            let phoneNumber = contacts[0].tel[0].replace(/\D/g, '');
                            // Only take the last 10 digits
                            let last10 = phoneNumber.slice(-10);
                            document.querySelector(`[name="${fieldId}"]`).value = last10;
                            return;
                        }
                    } catch (error) {
                        console.log("Contact Picker API error: " + error);
                    }
                }

                // Fallback to Cordova Contacts API (for apps wrapped in Cordova/PhoneGap)
                if (isCordonvaContactsSupported()) {
                    try {
                        let options = new ContactFindOptions();
                        options.filter = "";
                        options.multiple = false;
                        options.desiredFields = [navigator.contacts.fieldType.phoneNumbers];

                        navigator.contacts.find(
                            [navigator.contacts.fieldType.displayName, navigator.contacts.fieldType.phoneNumbers],
                            function (contacts) {
                                if (contacts && contacts.length > 0) {
                                    const contact = contacts[0];
                                    if (contact.phoneNumbers && contact.phoneNumbers.length > 0) {
                                        let phoneNumber = contact.phoneNumbers[0].value.replace(/\D/g, '');
                                        // Only take the last 10 digits
                                        let last10 = phoneNumber.slice(-10);
                                        document.querySelector(`[name="${fieldId}"]`).value = last10;
                                    }
                                }
                            },
                            function (error) {
                                console.log("Cordova Contact error: " + error);
                            }
                        );
                        return;
                    } catch (error) {
                        console.log("Cordova Contacts error: " + error);
                    }
                }

                // If no contact APIs available, show a message
                if (isMobileDevice()) {
                    alert("Your mobile browser doesn't support the contact picker feature. Please enter the phone number manually.\n\nNote: This feature works best with Android native apps or certain mobile browsers with permission granted.");
                } else {
                    alert("Contact book feature is available on mobile devices only. Please enter the phone number manually.");
                }
            }

            // Initialize contact buttons visibility based on device capability
            document.addEventListener('DOMContentLoaded', function () {
                const hasContactSupport = isContactPickerSupported() || isCordonvaContactsSupported();
                const contactButtons = document.querySelectorAll('.contact-book-btn');

                if (!hasContactSupport && !isMobileDevice()) {
                    // Hide contact buttons on non-mobile desktop browsers
                    contactButtons.forEach(btn => {
                        btn.style.display = 'none';
                    });
                } else if (!hasContactSupport && isMobileDevice()) {
                    // Show contact buttons on mobile but with a disabled/muted appearance
                    contactButtons.forEach(btn => {
                        btn.title = 'Contact picker not available in this browser';
                        btn.style.opacity = '0.6';
                        btn.style.cursor = 'not-allowed';
                    });
                }
            });

            // Handle conditional fields for Type
            document.addEventListener('DOMContentLoaded', function () {
                const typeSelect = document.getElementById('type');
                const brokerageFields = document.querySelectorAll('.brokerage-fields');

                function toggleBrokerage() {
                    if (typeSelect.value === 'TRADER') {
                        brokerageFields.forEach(el => el.style.display = 'none');
                    } else {
                        brokerageFields.forEach(el => el.style.display = 'block');
                    }
                }

                if (typeSelect) {
                    typeSelect.addEventListener('change', toggleBrokerage);
                    toggleBrokerage(); // Initial call
                }
            });
        </script>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>

</html>
