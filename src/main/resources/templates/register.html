<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="icon" type="image/png" th:href="@{/favicon.png}">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
/* ---------- GLOBAL ---------- */
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://t4.ftcdn.net/jpg/17/42/93/47/240_F_1742934729_zZy9JHoPHwI1G7xBOGUdAE47A9N6zarS.jpg");
  background-size: cover;
  background-position: center;
  padding: 20px;
}

/* ---------- WRAPPER ---------- */
.login-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

/* ---------- TITLE ---------- */
.welcome-title {
  color: #ffffff;
  font-size: 26px;
  font-weight: 600;
  margin-bottom: 18px;
  text-align: center;
}

/* ---------- CARD ---------- */
.login-card {
  width: 100%;
  max-width: 420px;
  padding: 30px 25px;
  border-radius: 14px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card h3 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 26px;
  color: #1f2933;
}

/* ---------- INPUTS ---------- */
.form-control {
  border-radius: 8px;
  padding: 12px;
  font-size: 15px;
}

.form-control:focus {
  border-color: #39d98a;
  box-shadow: 0 0 0 0.15rem rgba(57,217,138,0.25);
}

/* ---------- BUTTON ---------- */
.btn-main {
  background: #39d98a;
  border: none;
  color: #000;
  font-weight: 600;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
}

.btn-main:hover {
  background: #2ecf7f;
}

/* ---------- PASSWORD TOGGLE ---------- */
.password-toggle {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 16px;
  opacity: 0.7;
}

.password-toggle:hover {
  opacity: 1;
}

/* ---------- OTP BOXES ---------- */
.otp-boxes {
  display: flex;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 5px;
}

.otp-boxes input {
  width: 100%;
  max-width: 48px;
  height: 48px;
  text-align: center;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #ced4da;
  transition: all 0.2s ease;
}

@media (max-width: 380px) {
  .otp-boxes input {
    height: 40px;
    font-size: 16px;
  }
}

.otp-boxes input:focus {
  border-color: #39d98a;
  box-shadow: 0 0 0 0.15rem rgba(57,217,138,0.25);
  transform: scale(1.05);
}

/* ---------- TIMER & RESEND ---------- */
.otp-footer {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 14px;
}

.resend-btn {
  background: none;
  border: none;
  color: #39d98a;
  font-weight: 600;
  cursor: pointer;
}

.resend-btn:disabled {
  color: #aaa;
  cursor: not-allowed;
}

/* ---------- LINKS ---------- */
.login-links {
  font-size: 13px;
  margin-top: 18px;
  text-align: center;
}
.login-links a {
  color: #39d98a;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="login-wrapper">
  <div class="welcome-title">Create Account</div>

  <div class="login-card">
    <h3>Register</h3>

    <!-- SEND OTP -->
    <form th:action="@{/send-register-otp}" method="post" th:unless="${otpSent}" onsubmit="return validateRegistration(event)">

      <input class="form-control mb-3" name="name" placeholder="Full Name" required>

      <input class="form-control mb-3" type="email" name="email"
             placeholder="Email address" required>

      <div class="position-relative mb-3">
        <input class="form-control" type="password"
               name="password" id="password"
               placeholder="Password" required minlength="4">
        <span class="password-toggle" onclick="togglePassword('password', this)">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <div class="position-relative mb-3">
        <input class="form-control" type="password"
               id="confirmPassword"
               placeholder="Confirm Password" required minlength="4">
        <span class="password-toggle" onclick="togglePassword('confirmPassword', this)">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <button type="submit" class="btn btn-main w-100">Send OTP</button>

      <div class="text-center mt-3 mb-2" style="font-size: 14px; color: #6c757d;">OR</div>
      <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-dark w-100 mb-3" style="border-radius: 8px; font-weight: 600;">
        <i class="fab fa-google me-2" style="color: #DB4437;"></i> Register with Google
      </a>
    </form>

    <!-- VERIFY OTP -->
    <div th:if="${otpSent}" class="mt-4">

      <form th:action="@{/verify-register-otp}" method="post" onsubmit="combineOtp()">

        <div class="otp-boxes">
          <input maxlength="1" class="otp" inputmode="numeric" oninput="moveNext(this,0)" onkeypress="return isNumber(event)">
          <input maxlength="1" class="otp" inputmode="numeric" oninput="moveNext(this,1)" onkeypress="return isNumber(event)">
          <input maxlength="1" class="otp" inputmode="numeric" oninput="moveNext(this,2)" onkeypress="return isNumber(event)">
          <input maxlength="1" class="otp" inputmode="numeric" oninput="moveNext(this,3)" onkeypress="return isNumber(event)">
          <input maxlength="1" class="otp" inputmode="numeric" oninput="moveNext(this,4)" onkeypress="return isNumber(event)">
          <input maxlength="1" class="otp" inputmode="numeric" oninput="moveNext(this,5)" onkeypress="return isNumber(event)">
        </div>

        <input type="hidden" name="otp" id="otp">

        <div class="otp-footer">
          <span id="timer">01:00</span>
          <button type="button" id="resendBtn"
                  class="resend-btn" onclick="resendOtp()" disabled>
            Resend OTP
          </button>
        </div>

        <button type="submit" class="btn btn-main w-100">
          Verify OTP & Register
        </button>
      </form>
    </div>

    <div th:if="${error}" class="alert alert-danger mt-3"
         th:text="${error}"></div>

    <div class="login-links">
      Already have an account?
      <a href="/">Login</a>
    </div>

  </div>
</div>

<script>
/* PASSWORD TOGGLE */
function togglePassword(id, el) {
  const p = document.getElementById(id);
  const icon = el.querySelector('i');
  
  if (p.type === "password") {
    p.type = "text";
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    p.type = "password";
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}

/* FORM VALIDATION */
function validateRegistration(event) {
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;
  
  if (pass !== confirm) {
    alert("Passwords do not match!");
    event.preventDefault();
    return false;
  }
  return true;
}

/* OTP AUTO MOVE */
function moveNext(el, index) {
  if (el.value.length === 1) {
    const next = document.querySelectorAll(".otp")[index + 1];
    if (next) next.focus();
  }
}

/* COMBINE OTP */
function combineOtp() {
  let otp = "";
  document.querySelectorAll(".otp").forEach(i => otp += i.value);
  document.getElementById("otp").value = otp;
}

/* TIMER */
let time = 60;
const timerEl = document.getElementById("timer");
const resendBtn = document.getElementById("resendBtn");

function startTimer() {
    time = 60;
    resendBtn.disabled = true;
    const interval = setInterval(() => {
      if (time <= 0) {
        clearInterval(interval);
        resendBtn.disabled = false;
        timerEl.textContent = "00:00";
        return;
      }
      time--;
      const min = String(Math.floor(time / 60)).padStart(2,'0');
      const sec = String(time % 60).padStart(2,'0');
      timerEl.textContent = `${min}:${sec}`;
    }, 1000);
}

if (timerEl) startTimer();

/* RESEND OTP */
function resendOtp() {
    const formData = new FormData();
    // These are stored in session on backend, but send-register-otp endpoint expects them
    // However, since they are already in session, we might need a simpler resend endpoint
    // Or just submit the form again if we had the data.
    // Let's check the controller... it needs name, email, password.
    
    // Actually, the simplest way is to just trigger the form submission of the "Send OTP" form
    // but that form is hidden. 
    
    // Let's use fetch to the same endpoint with existing session data if possible,
    // but the endpoint requires @RequestParam.
    
    // We can just reload the page or redirect back to registration if we don't want to overcomplicate.
    // But a fetch is better.
    
    fetch('/resend-register-otp', {
        method: 'POST'
    }).then(() => {
        alert("OTP Resent!");
        startTimer();
    });
}

function isNumber(evt) {
    evt = (evt) ? evt : window.event;
    var charCode = (evt.which) ? evt.which : evt.keyCode;
    if (charCode > 31 && (charCode < 48 || charCode > 57)) {
        return false;
    }
    return true;
}
</script>

</body>
</html>
