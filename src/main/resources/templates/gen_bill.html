<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generate Job Contract</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Select2 CSS (SEARCH DROPDOWN) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    body {
        font-family: "Times New Roman", serif;
        background:
            linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
            url("https://t3.ftcdn.net/jpg/16/23/08/86/240_F_1623088639_VM4EkuCvXjWV7qfyzIBr4e6GDzCeY3rA.jpg");
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        margin: 0;
    }

    .navbar {
        background: linear-gradient(135deg, #1f2a30, #243840);
        height: 80px;
    }

    .navbar-brand {
        font-weight: 600;
        font-size: 25px;
    }

    .nav-link {
        margin: 0 14px;
        font-size: 18px;
        font-weight: 600;
        color: #fff !important;
    }

    .bill-card {
        background: rgba(255,255,255,0.95);
        border-radius: 8px;
        padding: 30px;
        max-width: 900px;
        margin: 30px auto;
    }

    .contract-header {
        text-align: center;
        border-bottom: 2px solid #333;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        font-size: 0.9rem;
    }

    .form-control {
        border: none;
        border-bottom: 1px solid #000;
        border-radius: 0;
        background: transparent;
    }

    .section-box {
        border: 1px solid #000;
        padding: 12px;
        margin-bottom: 15px;
    }

    .btn-submit {
        background: #333;
        color: #fff;
        font-weight: bold;
    }

    #loadingOverlay {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    /* Select2 full width */
    .select2-container {
        width: 100% !important;
    }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand">ShreeGuru Software Solutions</span>

    <div class="d-flex align-items-center">
        <ul class="navbar-nav flex-row align-items-center">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/weaver-trader">Weaver / Trader Master</a></li>
            <li class="nav-item"><a class="nav-link" href="/report">Report</a></li>
            <li class="nav-item"><a class="nav-link" href="/quality">Quality Master</a></li>
        </ul>

        <form action="/logout" method="post" class="ms-3">
            <button class="btn btn-danger">Logout</button>
        </form>
    </div>
</nav>

<!-- LOADER -->
<div id="loadingOverlay">
    <div class="text-center">
        <div class="spinner-border text-dark" style="width:4rem;height:4rem"></div>
        <div class="mt-2 fw-bold">Processing...</div>
    </div>
</div>

<!-- FORM -->
<div class="bill-card">

    <div class="contract-header">
        <h4>Airjet Loom Owner's Association, Ichalkaranji</h4>
        <small th:text="${editMode} ? 'EDIT JOB CONTRACT' : 'JOB CONTRACT'"></small>
    </div>

    <form id="billForm">

        <input type="hidden" name="userId" th:value="${job?.userId}">
        <input type="hidden" name="contractNo" th:value="${job?.contractNo}">

        <!-- Date -->
        <div class="section-box">
            <label>Date</label>
            <input type="date" class="form-control" id="contractDate" name="contract_date">
        </div>

        <!-- Weaver -->
        <div class="section-box">
            <label>Weaver</label>
            <select class="form-control searchable" name="weaver_name" id="weaverSelect">
                <option value="">Select Weaver</option>
                <option th:each="w : ${weavers}"
                        th:value="${w.name}"
                        th:text="${w.name}"
                        th:selected="${job?.weaverName == w.name}">
                </option>
            </select>

            <label class="mt-2">Weaver Brokerage %</label>
            <input class="form-control mb-2" name="weaver_brokerage_percent" id="weaverBrokeragePercent"
                   th:value="${job?.weaverBrokeragePercent}" readonly>

            <label>Weaver Brokerage Paisa (₹)</label>
            <input class="form-control" name="weaver_brokerage_paisa" id="weaverBrokeragePaisa"
                   th:value="${job?.weaverBrokeragePaisa}" readonly>
        </div>

        <!-- Trader -->
        <div class="section-box">
            <label>Trader</label>
            <select class="form-control searchable" name="trader_name">
                <option value="">Select Trader</option>
                <option th:each="t : ${traders}"
                        th:value="${t.name}"
                        th:text="${t.name}"
                        th:selected="${job?.traderName == t.name}">
                </option>
            </select>

            <label class="mt-2">Broker :
                <span th:text="${#authentication.principal.name}"></span>
            </label>
        </div>

        <!-- Quality -->
        <div class="section-box">
            <label>Quality</label>
            <select class="form-control searchable" name="quality" id="qualitySelect">
                <option value="">Select Quality</option>
                <option th:each="q : ${quality}"
                        th:value="${q.qualityName}"
                        th:text="${q.qualityName}"
                        th:selected="${job?.quality == q.qualityName}">
                </option>
            </select>

            <label class="mt-2">Pick</label>
            <input class="form-control mb-2" name="pick" id="pick"
                   th:value="${job?.pick}" readonly>

            <label>Quantity (Meters)</label>
            <input class="form-control mb-2" name="quantity_meters" id="quantityMeters"
                   th:value="${job?.quantityMeters}">

            <label>Beam</label>
            <input class="form-control mb-2" name="beams"
                   th:value="${job?.beams}">
        </div>
        
        <div class="mt-3">
    		<label>Sizing Fabric</label>

    		<div class="form-check">
        		<input class="form-check-input"
             		type="radio"
               		name="sizing_fabric"
               		value="Sizing"
               		th:checked="${job?.sizingfabric == 'YES'}">
        		<label class="form-check-label">Sizing</label>
        	</div>

    		<div class="form-check">
        		<input class="form-check-input"
               		type="radio"
               		name="sizing_fabric"
               		value="Fabric"
               		th:checked="${job?.sizingfabric == 'NO'}">
        		<label class="form-check-label">Fabric</label>
    		</div>
		</div>

        <!-- Job Details -->
        <div class="section-box">
            <label>Job Rate</label>
            <input class="form-control mb-2" name="job_rate" id="jobRate"
                   th:value="${job?.jobRate}">

            <label>Rate = ((Job Rate/100) * Pick)</label>
            <input class="form-control mb-2" name="rate" id="rate"
                   th:value="${job?.rate}" readonly>

            <label>Amount = (Rate * Quantity Mtr)</label>
            <input class="form-control mb-2" name="amount" id="amount"
                   th:value="${job?.amount}" readonly>

            <label>Brokerage % Amt = Amount * (Brokerage %/100)</label>
            <input class="form-control mb-2" name="brokerage_percent_amt" id="brokeragePercentAmt"
                   th:value="${job?.brokeragePercentAmt}" readonly>

            <label>Brokerage Mtr Amt = Quantity Mtr * (Brokerage Paisa/100)</label>
            <input class="form-control mb-2" name="brokerage_mtr_amt" id="brokerageMtrAmt"
                   th:value="${job?.brokerageMtrAmt}" readonly>

            <label>Payment Days</label>
            <input class="form-control mb-2" name="payment_days"
                   th:value="${job?.paymentDays}">
        </div>

        <!-- Production -->
        <div class="section-box">
            <label>Production Schedule</label>
            <input class="form-control mb-2" name="production_schedule"
                   th:value="${job?.productionSchedule}">

            <label>No of Machines</label>
            <input class="form-control mb-2" name="no_of_machines"
                   th:value="${job?.noOfMachines}">
        </div>

        <!-- Remark -->
        <div class="section-box">
            <label>Remark</label>
            <input class="form-control" name="remark"
                   th:value="${job?.remark}">
        </div>

        <!-- Delivery -->
        <div class="section-box">
            <label>Cut Length</label>
            <input class="form-control mb-2" name="cut_length"
                   th:value="${job?.cutLength}">

            <label>Minimum Delivery</label>
            <input class="form-control mb-2" name="minimum_delivery"
                   th:value="${job?.minimumDelivery}">

            <label>Rolling / Folding</label>

            <div class="form-check">
                <input class="form-check-input" type="radio"
                       name="rolling_folding" value="ROLLING"
                       th:checked="${job?.rollingFolding == 'ROLLING'}">
                <label class="form-check-label">Rolling</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio"
                       name="rolling_folding" value="FOLDING"
                       th:checked="${job?.rollingFolding == 'FOLDING'}">
                <label class="form-check-label">Folding</label>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-submit w-100 mt-3"
                th:text="${editMode} ? 'UPDATE CONTRACT' : 'SUBMIT'">
        </button>

    </form>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    // Set today's date
    document.addEventListener("DOMContentLoaded", function () {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById("contractDate").value = `${year}-${month}-${day}`;
    });

    // Submit logic
    const form = document.getElementById("billForm");
    const loader = document.getElementById("loadingOverlay");
    const submitBtn = document.getElementById("submitBtn");

    // Initialize Select2 and event listeners
    $(document).ready(function() {
        $('.searchable').select2({
            placeholder: "Search here...",
            allowClear: true
        });

        // Auto-fill Weaver Brokerage on weaver selection
        $('#weaverSelect').on('select2:select', function(e) {
            const weaverName = $(this).val();
            console.log("Weaver selected:", weaverName);
            if (weaverName) {
                const url = `/api/weaver-details/${encodeURIComponent(weaverName)}`;
                console.log("Fetching from:", url);
                fetch(url)
                    .then(res => {
                        console.log("Response status:", res.status);
                        return res.json();
                    })
                    .then(data => {
                        console.log("Weaver data:", data);
                        document.getElementById("weaverBrokeragePercent").value = data.brokeragePercent || 0;
                        document.getElementById("weaverBrokeragePaisa").value = data.brokeragePaisa || 0;
                        calculateAll();
                    })
                    .catch(err => console.error("Error fetching weaver details:", err));
            }
        });

        // Auto-fill Pick from Quality
        $('#qualitySelect').on('select2:select', function(e) {
            const qualityName = $(this).val();
            console.log("Quality selected:", qualityName);
            if (qualityName) {
                const url = `/api/quality-details/${encodeURIComponent(qualityName)}`;
                console.log("Fetching from:", url);
                fetch(url)
                    .then(res => {
                        console.log("Response status:", res.status);
                        return res.json();
                    })
                    .then(data => {
                        console.log("Quality data:", data);
                        document.getElementById("pick").value = data.pick || 0;
                        calculateAll();
                    })
                    .catch(err => console.error("Error fetching quality details:", err));
            }
        });
    });

    // Listen for changes to recalculate
    const jobRateInput = document.getElementById("jobRate");
    const quantityMetersInput = document.getElementById("quantityMeters");

    if (jobRateInput) jobRateInput.addEventListener("change", calculateAll);
    if (jobRateInput) jobRateInput.addEventListener("input", calculateAll);
    if (quantityMetersInput) quantityMetersInput.addEventListener("change", calculateAll);
    if (quantityMetersInput) quantityMetersInput.addEventListener("input", calculateAll);

    function calculateAll() {
        // Get values
        const jobRate = parseFloat(document.getElementById("jobRate")?.value || 0);
        const pick = parseFloat(document.getElementById("pick")?.value || 0);
        const quantityMeters = parseFloat(document.getElementById("quantityMeters")?.value || 0);
        const brokeragePercent = parseFloat(document.getElementById("weaverBrokeragePercent")?.value || 0);
        const brokeragePaisa = parseFloat(document.getElementById("weaverBrokeragePaisa")?.value || 0);

        // 1. Rate = ((Job Rate/100) * Pick)
        const rate = (jobRate / 100) * pick;
        document.getElementById("rate").value = rate.toFixed(2);

        // 2. Amount = (Rate * Quantity Mtr)
        const amount = rate * quantityMeters;
        document.getElementById("amount").value = amount.toFixed(2);

        // 3. Brokerage % Amt = Amount * (Brokerage %/100)
        const brokeragePercentAmt = amount * (brokeragePercent / 100);
        document.getElementById("brokeragePercentAmt").value = brokeragePercentAmt.toFixed(2);

        // 4. Brokerage Mtr Amt = Quantity Mtr * (Brokerage Paisa/100)
        const brokerageMtrAmt = quantityMeters * (brokeragePaisa / 100);
        document.getElementById("brokerageMtrAmt").value = brokerageMtrAmt.toFixed(2);
    }

    // Calculate on page load if editing
    document.addEventListener("DOMContentLoaded", function() {
        // Set today's date
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById("contractDate").value = `${year}-${month}-${day}`;

        // Initial calculation if editing
        calculateAll();
    });

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        submitBtn.disabled = true;
        loader.style.display = "flex";

        fetch("/gen_bill", {
            method: "POST",
            body: new URLSearchParams(new FormData(form))
        })
        .then(() => {
            loader.style.display = "none";
            submitBtn.disabled = false;
            Swal.fire("Success", "Job contract saved successfully", "success")
                .then(() => window.location.href = "/dashboard");
        })
        .catch(() => {
            loader.style.display = "none";
            submitBtn.disabled = false;
            Swal.fire("Error", "Server error occurred", "error");
        });
    });
</script>

</body>
</html>
