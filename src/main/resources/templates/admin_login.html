<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* ---------- GLOBAL ---------- */
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* ---------- LOGIN WRAPPER ---------- */
        .admin-login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        /* ---------- ADMIN ICON ---------- */
        .admin-icon {
            font-size: 48px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        /* ---------- TITLE ---------- */
        .admin-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .admin-subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ---------- LOGIN CARD ---------- */
        .admin-login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* ---------- FORM ---------- */
        .admin-login-card h4 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
            color: #1f2933;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1f2933;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        /* ---------- BUTTON ---------- */
        .btn-admin-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-admin-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        /* ---------- ERROR/SUCCESS ALERTS ---------- */
        .alert {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: none;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
        }

        /* ---------- BACK LINK ---------- */
        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* ---------- DEMO CREDENTIALS ---------- */
        .demo-info {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 20px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="admin-login-wrapper">
        <div class="admin-icon">🔐</div>
        <div class="admin-title">Admin Panel</div>
        <div class="admin-subtitle">Manage Payment Subscriptions</div>

        <div class="admin-login-card">
            <h4>Admin Login</h4>

            <!-- ERROR MESSAGE -->
            <div th:if="${error}" class="alert alert-danger">
                <strong>Error!</strong> <span th:text="${error}"></span>
            </div>

            <form method="post" th:action="@{/admin/login}" id="adminLoginForm">
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username"
                        name="username" 
                        placeholder="Enter username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password"
                        name="password" 
                        placeholder="Enter password"
                        required>
                </div>

                <button type="submit" class="btn-admin-login">
                    Login to Admin Panel
                </button>
            </form>

            <div class="back-link">
                <a href="/">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
